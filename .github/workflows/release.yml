# Mailbox Windows 发布流水线
# 触发：打 v* tag（如 v0.1.0）
# 说明：
#   - Linux 宿主交叉编译 Windows NSIS 安装器（glibc iconv 无 macOS 回归，无需自建 patched makensis）
#   - 签名（SignPath Foundation / origin policy）接入点：平台配置就绪后，
#     在此处增加 SignPath GitHub 集成步骤（签名请求自动携带仓库 origin 数据，需人工批准）
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 nsis
          rustup target add x86_64-pc-windows-gnu

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.12.4

      # embedBootstrapper 打包期需从微软 fwlink 下载；仓库自带官方已验签副本，
      # 直接预置缓存（Linux 上 tauri 缓存目录为 ~/.cache/tauri）
      - name: Seed WebView2 bootstrapper cache
        run: |
          mkdir -p "${HOME}/.cache/tauri"
          cp src-tauri/webview2/MicrosoftEdgeWebview2Setup.exe "${HOME}/.cache/tauri/"

      - name: Build NSIS installer
        run: |
          cargo tauri build --target x86_64-pc-windows-gnu \
            --config '{"bundle":{"targets":["nsis"]}}'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailbox-setup
          path: src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe

      # 签名接入点（SignPath Foundation）：
      #   1) SignPath 平台配置项目/策略（origin verification + 人工批准）
      #   2) 此步骤调用 SignPath GitHub 集成提交签名请求（自动携带 origin 数据）
      #   3) 人工批准后下载签名产物并覆盖上方产物
      # 完成后安装器发布者显示为 SignPath Foundation，SmartScreen 警告消除。

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe \
            --title "${GITHUB_REF_NAME}" --generate-notes || true