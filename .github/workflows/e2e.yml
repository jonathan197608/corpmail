# 完整 GUI E2E（两阶段）：手动触发。
#
# 只能在 macOS 上跑：内嵌 WebDriver 服务端由 `--features e2e` 编入，macOS 没有
# WKWebView 的外部 driver，这是唯一可行路径（tauri-driver 只支持 Windows/Linux）。
# 不放进 push 门禁：单次要真起 GUI + mock IMAP/SMTP + 两阶段重启，分钟级耗时。
name: E2E

on:
  workflow_dispatch:
    inputs:
      spec:
        description: '只跑某个 spec（留空 = 主链路全部 + 阶段二）'
        required: false
        default: ''

jobs:
  e2e:
    name: 两阶段 E2E（macOS）
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 签名：E2E 会在真实钥匙串里存取密码，ad-hoc 签名的 ACL 每次链接都变，
      # 首次读取会弹授权框把自动化卡死。runner 上没有固定身份，故显式放行未签名
      # 模式（run.sh 只在 E2E_ALLOW_UNSIGNED=1 时才允许跳过；本地开发默认 fail-closed）
      - name: 跑完整 E2E
        env:
          E2E_ALLOW_UNSIGNED: '1'
        run: |
          if [ -n "${{ inputs.spec }}" ]; then
            ./e2e/run.sh --spec "${{ inputs.spec }}"
          else
            ./e2e/run.sh
          fi

      - name: 上传产物（截图/日志/报告）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
            e2e/logs
          if-no-files-found: warn
          retention-days: 14
