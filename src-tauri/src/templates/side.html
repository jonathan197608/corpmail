{# 侧栏（主界面 / 设置页 / 撰写页共用；上下文：frame）#}
<aside class="side">
    <div class="brand">
        <span class="brand-mark">✉</span>
        <div><b>Mailbox</b><small>企业邮箱客户端</small></div>
    </div>
    <a class="compose-btn" href="/compose">✎ 撰写邮件</a>
    <div class="side-title">文件夹</div>
    <a class="folder {% if frame.folder == 'inbox' %}on{% endif %}" href="/?folder=inbox">📥 收件箱 <span class="cnt">{{ frame.inbox }}{% if frame.inbox_unread > 0 %}
        <span class="unread-chip">{{ frame.inbox_unread }}</span>{% endif %}</span></a>
    <a class="folder {% if frame.folder == 'sent' %}on{% endif %}" href="/?folder=sent">📤 已发送 <span class="cnt">{{ frame.sent }}</span></a>
    <a class="folder {% if frame.folder == 'draft' %}on{% endif %}" href="/?folder=draft">📝 草稿 <span class="cnt">{{ frame.draft }}</span></a>
    <div class="side-foot">
        <div class="account">
            <span class="avatar">{{ frame.avatar }}</span>
            <div>
                <div class="who">{{ frame.display_name }}</div>
                <div class="addr">{{ frame.full_addr }}</div>
            </div>
            <a class="gear" href="/settings" title="设置">⚙</a>
        </div>
    </div>
</aside>
