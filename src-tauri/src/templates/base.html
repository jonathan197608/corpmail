<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mailbox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/app.css">
    <script src="/htmx.min.js" defer></script>
    <script src="/app.js" defer></script>
</head>

<body>
    {% block body %}{% endblock %}

    {# 附件预览模态（M5：img/pdf/text 三类内嵌渲染；页面共享） #}
    <div id="preview-modal" class="preview-modal" hidden>
        <div class="pm-mask" onclick="mbxClosePreview()"></div>
        <div class="pm-panel" role="dialog" aria-label="附件预览">
            <div class="pm-head">
                <span id="pm-name" class="pm-name"></span>
                <button type="button" class="pm-close" onclick="mbxClosePreview()" title="关闭预览">✕</button>
            </div>
            <div id="pm-body" class="pm-body"></div>
        </div>
    </div>
</body>

</html>
