<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mailbox</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/app.css">
    <script src="/htmx.min.js" defer></script>
    <script src="/app.js" defer></script>
    <style>
        /* 启动引导动画（M5）：内联样式不依赖 app.css，首帧即显；
           app.js 执行时移除（覆盖 HTML 注入到脚本就绪的间隙） */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 99;
            background: #f2f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            color: #5a6478;
            font-size: 13px;
        }

        #boot i {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid #d3dbe8;
            border-top-color: #3b6fd4;
            display: inline-block;
            animation: bootspin 0.8s linear infinite;
        }

        @keyframes bootspin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="boot"><i></i>正在启动 Mailbox…</div>
    {% block body %}{% endblock %}

    {# 附件预览模态（M5：img/pdf/text 三类内嵌渲染；页面共享） #}
    <div id="preview-modal" class="preview-modal" hidden>
        <div class="pm-mask" onclick="mbxClosePreview()"></div>
        <div class="pm-panel" role="dialog" aria-label="附件预览">
            <div class="pm-head">
                <span id="pm-name" class="pm-name"></span>
                <button type="button" class="pm-close" onclick="mbxClosePreview()" title="关闭预览">✕</button>
            </div>
            <div id="pm-body" class="pm-body"></div>
        </div>
    </div>
</body>

</html>
