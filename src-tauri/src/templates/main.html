{% extends "base.html" %}
{% block body %}
<div class="app on">
    {% include "side.html" %}
    <main class="main">
        <div class="topbar">
            <h1>收件箱</h1>
            <span class="sub">双击邮件查看详情</span>
            <button class="sync-btn" type="button" disabled title="收件功能将在后续版本开放">⟳ 收取新邮件</button>
            <div class="search" title="检索功能将在后续版本开放">
                <span>🔍</span>
                <input type="search" placeholder="搜索邮件…" disabled>
            </div>
        </div>

        <div class="mail-list">
            <div class="card empty-state">
                <div class="empty-mark">📭</div>
                <h2>还没有邮件</h2>
                <p>当前版本已完成账号配置与设置功能，<br>邮件收取、撰写与检索将在后续版本开放。</p>
                <a class="btn" href="/settings">打开设置</a>
            </div>
        </div>
    </main>
</div>
{% endblock %}
