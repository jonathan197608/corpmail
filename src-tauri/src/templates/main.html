{% extends "base.html" %}
{% block body %}
<div class="app on">
    {% include "side.html" %}
    <main class="main">
        <div class="topbar">
            <h1>{{ folder_label }} <span class="sub">共 {{ total }} 封</span></h1>
            <a class="unread-toggle {% if unread_only %}on{% endif %}"
               href="{% if unread_only %}{{ page_base }}page={{ page }}{% else %}{{ page_base }}unread=1&page=1{% endif %}"
               {% if folder != 'inbox' %}hidden{% endif %}>● 只看未读</a>
            <button class="sync-btn" type="button" disabled title="收件功能将在后续版本开放">⟳ 收取新邮件</button>
            <div class="search" title="检索功能将在后续版本开放">
                <span>🔍</span>
                <input type="search" placeholder="搜索邮件…" disabled>
            </div>
        </div>

        {% include "mail_list.html" %}
    </main>
</div>
{% endblock %}
