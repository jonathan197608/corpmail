{# 设置·收信 pane（上下文：SettingsCtx）
   2026-11-16：从原「账号」页拆出。IMAP 服务器/加密方式与发信共用账号密码，
   全部为只读回显，因此本页没有保存表单；「测试收信」直接打后端端点，
   后端在表单无密码字段时回落到已存凭据。字段同样走 .sfield 左标签右控件。#}
{% import "icons.html" as ic %}
<div class="settings-pane on" id="settings-pane">
    <div class="card settings-card">
        <h3>收信（IMAP）</h3>
        <p class="desc">IMAP 增量同步，本地阅读后回写已读状态。与发信共用同一账号与密码；修改密码与自动收取策略分别到「发信」「收件同步」页。</p>

        <div class="sfield">
            <label>登录账号</label>
            <input class="mono" type="text" value="{{ account_prefix }}{{ account_domain }}" disabled
                spellcheck="false" title="首次配置时确定，如需变更请重新配置应用">
        </div>
        <div class="sfield">
            <label>收信服务器</label>
            <div class="port-row">
                <input class="mono" type="text" name="recv_host" value="{{ recv_host }}" spellcheck="false" disabled>
                <input class="num" type="text" name="recv_port" value="{{ recv_port }}" inputmode="numeric" disabled>
            </div>
        </div>
        <div class="sfield">
            <label>加密方式{{ ic.tip('自动 = 993 隐式 TLS、其余 STARTTLS') }}</label>
            <select name="recv_security" disabled>
                <option value="auto" {% if recv_security == "auto" %}selected{% endif %}>自动（按端口判断）</option>
                <option value="implicit" {% if recv_security == "implicit" %}selected{% endif %}>隐式 TLS（993/IMAPS）</option>
                <option value="starttls" {% if recv_security == "starttls" %}selected{% endif %}>STARTTLS（143）</option>
                <option value="plain" {% if recv_security == "plain" %}selected{% endif %}>明文（仅可信内网）</option>
            </select>
        </div>

        <div class="settings-actions">
            <button type="button" class="btn" hx-post="/settings/account/test-imap" hx-target="#imap-result"
                hx-swap="innerHTML" hx-disabled-elt="this">测试收信</button>
            <span id="imap-result" class="test-inline"></span>
        </div>
    </div>
</div>
