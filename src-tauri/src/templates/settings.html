{% extends "base.html" %}
{% block head %}
{# 模板 tab 的富文本编辑器（批次五）：与撰写页同一 vendored wangEditor #}
<link rel="stylesheet" href="/vendor/wang-editor/style.css">
<script src="/vendor/wang-editor/index.js" defer></script>
{% endblock %}
{% block body %}
<div class="app on">
    {% include "side.html" %}
    <main class="main">
        <div class="topbar">
            <h1>设置</h1>
            <span class="sub">账号与密码仅保存在本机</span>
        </div>

        <div class="settings-tabs">
            <span class="stab{% if tab == "account" %} on{% endif %}" hx-get="/settings/panes/account"
                hx-target="#settings-pane" hx-swap="outerHTML">账号</span>
            <span class="stab{% if tab == "sync" %} on{% endif %}" hx-get="/settings/panes/sync"
                hx-target="#settings-pane" hx-swap="outerHTML">收件同步</span>
            <span class="stab{% if tab == "storage" %} on{% endif %}" hx-get="/settings/panes/storage"
                hx-target="#settings-pane" hx-swap="outerHTML">存储管理</span>
            <span class="stab{% if tab == "templates" %} on{% endif %}" hx-get="/settings/panes/templates"
                hx-target="#settings-pane" hx-swap="outerHTML">模板</span>
            <span class="stab{% if tab == "about" %} on{% endif %}" hx-get="/settings/panes/about"
                hx-target="#settings-pane" hx-swap="outerHTML">关于</span>
        </div>

        <div class="settings">
            {% include "settings_pane_" ~ tab ~ ".html" %}
        </div>
    </main>
</div>{% endblock %}
