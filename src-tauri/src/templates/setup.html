{% extends "base.html" %}
{% block body %}
<div class="app on full">
    <div class="onboard">
        <div class="onboard-inner">
            <div class="steps">
                <span class="step done"><span class="n">✓</span> 欢迎</span>
                <span class="step-arrow">—</span>
                <span class="step on"><span class="n">2</span> 账号配置</span>
                <span class="step-arrow">—</span>
                <span class="step"><span class="n">3</span> 完成</span>
            </div>

            <form class="setup-card" hx-post="/welcome/setup/save" hx-target="#test-results" hx-swap="innerHTML" hx-trigger="submit throttle:500ms" hx-disabled-elt="find button">
                <h3>配置邮箱账号</h3>
                <p class="desc">填写后会自动测试发信与收信通道，全部通过才会保存。</p>

            <div class="sfield">
                <label>登录账号<small class="hint">域名可按需修改</small></label>
                <div class="port-row">
                    <input class="mono" type="text" name="account_prefix" value="{{ account_prefix }}" required
                        autocomplete="off" autocapitalize="none" spellcheck="false">
                    <input class="domain" type="text" name="account_domain" value="{{ account_domain }}"
                        autocomplete="off" autocapitalize="none" spellcheck="false">
                </div>
            </div>
            <div class="sfield">
                <label>密码 / 授权码</label>
                <input type="password" name="password" required autocomplete="new-password">
            </div>
                <div class="sfield">
                    <label>发件显示名</label>
                    <input type="text" name="display_name" placeholder="选填，如：张伟">
                </div>

                <div class="adv">
                    <div class="adv-title">服务器（已按公司邮箱预填，一般无需修改）</div>
                    <div class="sfield">
                        <label>SMTP 发信</label>
                        <div class="port-row">
                            <input class="mono" type="text" name="smtp_host" value="{{ smtp_host }}" spellcheck="false">
                            <input class="num" type="text" name="smtp_port" value="{{ smtp_port }}" inputmode="numeric">
                        </div>
                    </div>
                    <div class="sfield">
                        <label>SMTP 加密</label>
                        <select name="smtp_security">
                            <option value="auto" {% if smtp_security == "auto" %}selected{% endif %}>自动（465 隐式 TLS / 其余 STARTTLS）</option>
                            <option value="implicit" {% if smtp_security == "implicit" %}selected{% endif %}>隐式 TLS（465）</option>
                            <option value="starttls" {% if smtp_security == "starttls" %}selected{% endif %}>STARTTLS（587/25）</option>
                            <option value="plain" {% if smtp_security == "plain" %}selected{% endif %}>明文（仅可信内网）</option>
                        </select>
                    </div>
                    <div class="sfield">
                        <label>收信服务器（IMAP）</label>
                        <div class="port-row">
                            <input class="mono" type="text" name="recv_host" value="{{ recv_host }}" spellcheck="false">
                            <input class="num" type="text" name="recv_port" value="{{ recv_port }}" inputmode="numeric">
                        </div>
                    </div>
                    <div class="sfield">
                        <label>IMAP 加密</label>
                        <select name="recv_security">
                            <option value="auto" {% if recv_security == "auto" %}selected{% endif %}>自动（993 隐式 TLS / 其余 STARTTLS）</option>
                            <option value="implicit" {% if recv_security == "implicit" %}selected{% endif %}>隐式 TLS（993）</option>
                            <option value="starttls" {% if recv_security == "starttls" %}selected{% endif %}>STARTTLS（143）</option>
                            <option value="plain" {% if recv_security == "plain" %}selected{% endif %}>明文（仅可信内网）</option>
                        </select>
                    </div>
                </div>

                <div class="sfield">
                    <label>首次邮件拉取范围</label>
                    <div class="radio-row">
                        <label class="radio"><input type="radio" name="first_fetch_days" value="7"
                            {% if first_fetch_days == "7" %}checked{% endif %}><span class="dot"></span>最近 7 天</label>
                        <label class="radio"><input type="radio" name="first_fetch_days" value="30"
                            {% if first_fetch_days == "30" %}checked{% endif %}><span class="dot"></span>30 天</label>
                        <label class="radio"><input type="radio" name="first_fetch_days" value="90"
                            {% if first_fetch_days == "90" %}checked{% endif %}><span class="dot"></span>90 天</label>
                        <label class="radio"><input type="radio" name="first_fetch_days" value="0"
                            {% if first_fetch_days == "0" %}checked{% endif %}><span class="dot"></span>全部</label>
                    </div>
                </div>
                <div class="sfield">
                    <label>数据保存目录<small class="hint">留空使用默认目录</small></label>
                    <input class="mono" type="text" name="data_dir" value="{{ data_dir }}" spellcheck="false"
                        placeholder="选填：迁移邮件数据到自定义目录（填了新目录才会迁移，重启后生效）">
                </div>

                <div class="sec-note">🔒 密码保存进本机凭据保管（Windows 凭据管理器 / macOS 钥匙串），服务器与邮件数据保存在本机数据库。</div>

                <div id="test-results" class="test-row"></div>

                <div class="setup-actions">
                    <a class="btn link" href="/welcome">上一步</a>
                    <button type="submit" class="btn primary" hx-disabled-elt="this">测试并保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
