{% extends "base.html" %}
{% block body %}
<div class="app on full">
    <div class="onboard">
        <div class="onboard-inner">
            <div class="onboard-hero">
                <div class="onboard-mark">
                    <svg viewBox="0 0 24 24" width="44" height="44" fill="currentColor">
                        <path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5v-13Zm2.7.5 7.3 5.4L19.3 6H4.7Zm15.3 2-6.9 5.1a2 2 0 0 1-2.3 0L4 8v10.5c0 .3.2.5.5.5h15a.5.5 0 0 0 .5-.5V8Z"/>
                    </svg>
                </div>
                <h1>欢迎使用 CorpMail</h1>
                <p>企业邮箱收发一体 · 本地存档 · 中文全文检索</p>
            </div>

            <div class="card">
                <div class="feature-row">
                    <span class="fi">🔒</span>
                    <div>
                        <b>凭据交由操作系统保管</b>
                        <span>密码存入 Windows 凭据管理器 / macOS 钥匙串，数据库不留明文</span>
                    </div>
                </div>
                <div class="feature-row">
                    <span class="fi">🗄</span>
                    <div>
                        <b>全部邮件本地存档</b>
                        <span>SQLite 单文件数据库，附件 gzip 压缩，标题正文支持中文搜索</span>
                    </div>
                </div>
                <div class="feature-row">
                    <span class="fi">📡</span>
                    <div>
                        <b>标准协议直连公司邮件服务器</b>
                        <span>发信 smtp.chinatelecom.cn:465 · 收信 IMAP（993）</span>
                    </div>
                </div>

                <div class="onboard-actions">
                    <a class="btn primary big" href="/welcome/setup">开始配置（约 1 分钟）</a>
                </div>
            </div>

            <div class="onboard-foot">数据仅保存在本机，不经过任何第三方服务器</div>
        </div>
    </div>
</div>
{% endblock %}
