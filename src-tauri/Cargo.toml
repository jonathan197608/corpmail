[package]
name = "corpmail"
version = "0.3.0"
description = "CorpMail - Tauri + htmx 企业邮箱客户端（Rust 端渲染，无 Node 构建链）"
edition = "2024"

[lib]
name = "corpmail_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 依赖版本约定：约束只到语义化兼容区间（如 "2"/"0.31"，即 ^2/^0.31），
# 让 cargo update 能自由拿到兼容新版；仅 0.x 预发布库（无 semver 兼容保证，
# 如 imap alpha）才锁具体版本，并要求注明原因。
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"                                          # 表单 JSON 数组字段（M2 附件 keep_ids/attach_paths）
minijinja = { version = "3", features = ["serde"] }
url = "2"
encoding_rs = "0.8"                                        # 正文编码修复（M5：latin1 误标 mojibake 逆推 + GBK 兑底）
toml = "0.8"                                               # 独立配置文件 corpmail.toml（M5：数据目录/服务器/账号，随锚点目录常驻）

# --- 邮箱核心（M1 起，设计 §10.2）---
rusqlite = { version = "0.31", features = ["bundled"] }   # SQLite 3.45，FTS5 默认开启（§3）
keyring = "4"                                              # OS 凭据保管（§5.4）
aes-gcm = "0.10"                                           # keyfile 回退加密（§5.4）
base64 = "0.22"                                            # keyfile/密码辅助编码
lettre = { version = "0.11", features = ["builder", "smtp-transport", "native-tls"] }  # SMTP 测试连接（M3 发送）
imap = "3.0.0-alpha.15"                                    # IMAP 测试连接（M4 收件；3.0 仅有 alpha 预发布，无 semver 兼容保证故锁具体版；3.x 起 NoSelect 已可用，降 2.4.1 见 §13-R2）
imap-proto = "0.16"                                          # imap 库未再导出 NameAttribute（发件箱 NoSelect 判定；版本随 imap 传递锁定）
mailparse = "0.18"                                         # MIME 解析（M4 收件：multipart/附件/RFC2047 解码，spike 已验证）
jiff = "0.2"                                               # 时间戳格式化（RFC2822/展示）
jieba-rs = "0.11"                                          # 中文预分词（§4：写入影子列，FTS 索引源；M2 写入侧）
flate2 = "1"                                               # 附件 gzip（§5.1 两级存储）
sha2 = "0.10"                                              # 附件指纹（§5.1 sha256 列）
tauri-plugin-dialog = "2"                                  # 系统文件/保存对话框（M2：附件选择与另存）
# M4-1 托盘：依赖 tauri tray-icon 特性（Cargo.toml tauri features）
tauri-plugin-single-instance = "2"
ammonia = "4"
ureq = "2"
tauri-plugin-notification = "2"
# E2E 测试专用（feature `e2e`，见文件末尾 [features]；release 构建不编入）
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

# --- Windows 交付（设计 §11.2/11.3 v3.4：官方 NSIS 安装器）---
# 零 vendor：上游 webview2-com-sys 0.39.1 gnu 目标动态链接 WebView2Loader.dll，
# 由官方链路自动处理——tauri-build 构建期拷贝到产物目录、tauri-bundler 打包进
# NSIS 安装到 $INSTDIR 与主程序同级；Runtime 由安装器 embedBootstrapper 内嵌安装。
# 主程序不再内嵌 Bootstrapper（原 ensure_runtime 已移除），无 runas/windows 依赖。

[lints.rust]
# 路径限定不必要（item 已在作用域仍写全路径）：cargo fix 可自动修复
unused_qualifications = "warn"

[features]
# E2E 自动化测试构建：编入内嵌 WebDriver 服务端（tauri-plugin-wdio-webdriver，
# 进程内 HTTP，无需外部 driver，macOS 的 WKWebView 唯一可行路径）。
# 默认关闭 —— release/生产二进制不含该插件与端口监听。
e2e = ["dep:tauri-plugin-wdio-webdriver"]


[profile.release]
lto = "thin"
strip = true
codegen-units = 1
